name: release

on:
  push:
    tags:
      - 'contracts-v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Verify tag and package versions
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#contracts-v}"
          NPM_VERSION="$(node -p "require('./package.json').version")"
          PYTHON_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "$VERSION" = "$NPM_VERSION"
          test "$VERSION" = "$PYTHON_VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Test contracts
        run: npm test
      - name: Build artifacts
        run: |
          npm pack
          python -m build --wheel
      - name: Clean-install probe
        run: |
          mkdir -p /tmp/contracts-node-probe
          cd /tmp/contracts-node-probe
          npm init -y >/dev/null
          npm install --ignore-scripts "$GITHUB_WORKSPACE/cortex-contracts-${{ steps.version.outputs.value }}.tgz"
          node --input-type=module -e "import {version,getSchema} from '@cortex/contracts'; const s=getSchema('https://cortex.dev/schemas/task-envelope.json'); if(version!=='${{ steps.version.outputs.value }}'||s.\$id!=='https://schemas.this.live/cortex/task-envelope.json') process.exit(1)"
          python -m venv /tmp/contracts-python-probe
          /tmp/contracts-python-probe/bin/pip install "$GITHUB_WORKSPACE/dist/cortex_contracts-${{ steps.version.outputs.value }}-py3-none-any.whl"
          /tmp/contracts-python-probe/bin/python -c "import cortex_contracts as c; s=c.get_schema('https://cortex.dev/schemas/task-envelope.json'); assert c.__version__=='${{ steps.version.outputs.value }}'; assert s['\$id']=='https://schemas.this.live/cortex/task-envelope.json'"
      - name: Stage checksummed assets
        run: |
          mkdir -p /tmp/contracts-release
          cp "cortex-contracts-${{ steps.version.outputs.value }}.tgz" /tmp/contracts-release/
          cp "dist/cortex_contracts-${{ steps.version.outputs.value }}-py3-none-any.whl" /tmp/contracts-release/
          cd /tmp/contracts-release
          sha256sum * > SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: contracts ${{ steps.version.outputs.value }}
          body: |
            MIT-licensed Cortex shared contracts with owned schema identifiers.
            See `PROVENANCE.md` for the canonical source commit.
          files: |
            /tmp/contracts-release/cortex-contracts-${{ steps.version.outputs.value }}.tgz
            /tmp/contracts-release/cortex_contracts-${{ steps.version.outputs.value }}-py3-none-any.whl
            /tmp/contracts-release/SHA256SUMS
          fail_on_unmatched_files: true
